<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>방향판</title>
<meta name="description" content="The whiteboard for humans in an agent world">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318181b'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23d9381e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#18181b;--ink2:#3f3f46;--mut:#5c5c63;--fnt:#6b6b6b;--line:#e4e4e7;--line2:#ececee;
  --red:#d9381e;--red-wash:#fdf3f1;--ok:#2c8a54;--ring:#171717;
  --ui:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --pen:"Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --lift:0 1px 2px rgba(39,39,42,.06),0 8px 22px rgba(39,39,42,.08);
  --lift-hi:0 2px 4px rgba(39,39,42,.08),0 16px 40px rgba(39,39,42,.14);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

#stage{position:fixed;inset:0;touch-action:none;background-color:#fff;background-image:radial-gradient(circle,#e7e7eb 0.7px,transparent 0.9px);cursor:default;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage.panning{cursor:grabbing}
#stage.placing{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}

.it{position:absolute;outline:none}
.it.sel::after{content:"";position:absolute;inset:-5px;border:1.5px solid var(--ink);border-radius:10px;pointer-events:none}
.it .tx{outline:none;white-space:pre-wrap;overflow-wrap:anywhere}
.it .tx[contenteditable="true"]{cursor:text;user-select:text;-webkit-user-select:text}
.it .tx:empty::before{content:attr(data-ph);color:rgba(24,24,27,.32)}

.sticky{border-radius:4px;box-shadow:var(--lift);padding:14px 16px 18px;display:flex;flex-direction:column}
.sticky .tx{font-family:var(--pen);font-size:26px;line-height:1.12;color:#27272a;flex:1}
.sticky .who{font-size:11px;color:rgba(24,24,27,.42);margin-top:6px}
.c-yellow{background:#fff6c9}.c-pink{background:#fde4ec}.c-blue{background:#e2efff}.c-green{background:#e3f5e6}.c-white{background:#fff;border:1px solid var(--line)}

.text .tx{font-family:var(--pen);font-size:34px;line-height:1.1;color:var(--ink);min-height:38px}
.text.big .tx{font-size:64px}

.goal{background:#fff;border:1.8px solid var(--ink);border-radius:14px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px}
.goal .g-top{display:flex;align-items:center;gap:8px}
.goal .g-chk{width:22px;height:22px;flex:none;border:0;padding:0;background:none}
.goal .g-chk svg{display:block}
.goal .g-due{font-family:var(--pen);font-size:24px;line-height:1;color:var(--mut)}
.goal .g-d{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink)}
.goal .g-d.late{color:var(--red)}
.goal .tx{font-family:var(--pen);font-size:32px;line-height:1.08;color:var(--ink)}
.goal.done{border-color:#d4d4d8}
.goal.done .tx{color:var(--fnt);text-decoration:line-through}
.goal.late:not(.done){border-color:var(--red)}

.frame{border:1.5px dashed #d4d4d8;border-radius:18px;background:rgba(250,250,250,.55)}
.frame .ft{position:absolute;left:14px;top:-34px;font-family:var(--pen);font-size:30px;line-height:1;color:var(--ink2);white-space:nowrap}
.frame .tx{min-width:40px}

.it.dim{opacity:.2}
.ar-tag{position:absolute;left:8px;top:-10px;display:flex;align-items:center;gap:4px;font-size:10.5px;line-height:17px;padding:0 6px;border-radius:5px;background:#fff;border:1px solid var(--line);color:var(--ink2);pointer-events:none;white-space:nowrap}
.ar-tag i,.ar-row i,.rd-name i{width:7px;height:7px;border-radius:50%;flex:none}
.by-agent{position:absolute;right:8px;top:-9px;font-family:var(--mono);font-size:10px;line-height:16px;padding:0 6px;border-radius:5px;background:#fff;border:1px solid var(--line);color:var(--mut);pointer-events:none}
.rz{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;border-radius:5px;background:#fff;border:1.5px solid var(--ink);cursor:nwse-resize;z-index:2}

/* UI chrome */
.ui{position:fixed;z-index:20;font-size:13px}
.pill{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--lift)}
#topL{left:16px;top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
#brand{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 10px}
#brand .mk{width:20px;height:20px;border-radius:6px;background:var(--ink);display:grid;place-items:center}
#brand .mk i{width:5px;height:5px;border-radius:50%;background:var(--red)}
#brand b{font-size:14px}
#boardBtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:0;background:transparent;border-left:1px solid var(--line2);border-radius:0 12px 12px 0}
#boardBtn .k{font-size:11px;color:var(--fnt)}
#boardBtn:hover{background:#fafafa}
#boards{left:16px;top:calc(60px + env(safe-area-inset-top));width:260px;padding:8px}
#boards .sec{font-size:11px;color:var(--fnt);padding:8px 8px 4px}
#boards .b{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:13.5px}
#boards .b:hover{background:#f4f4f5}
#boards .b.on{background:#f1f1f3;font-weight:600}
#boards .b .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fnt)}
#boards .add{display:flex;gap:6px;padding:6px 4px 2px}
#boards .add input{flex:1;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:13px}
#boards .add button{height:32px;padding:0 10px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:600}

#topR{right:16px;top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;padding:4px}
#topR button{height:30px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:12.5px;color:var(--ink2)}
#topR button:hover{background:#f4f4f5}
#zoomLbl{font-family:var(--mono);font-size:12px!important;min-width:54px}
#syncLbl{display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;font-size:12px;color:var(--mut);white-space:nowrap}
#syncLbl i{width:6px;height:6px;border-radius:50%;background:#d4d4d8}
#syncLbl.ok i{background:var(--ok)}#syncLbl.err i{background:var(--red)}#syncLbl.err{color:var(--red)}

#tools{left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;padding:6px}
#tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:62px;height:52px;border:0;border-radius:9px;background:transparent;color:var(--ink2)}
#tools button span{font-size:11px}
#tools button:hover{background:#f4f4f5}
#tools button[aria-pressed="true"]{background:var(--ink);color:#fff}
#tools svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tools .sep{width:1px;background:var(--line2);margin:8px 4px}

#selTool{display:flex;align-items:center;gap:4px;padding:5px;transform:translate(-50%,-100%)}
#selTool .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.08);padding:0}
#selTool .sw.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
#selTool .tb{height:28px;padding:0 9px;border:0;border-radius:7px;background:transparent;font-size:12.5px;color:var(--ink2)}
#selTool .tb:hover{background:#f4f4f5}
#selTool .tb.del{color:var(--red)}
#selTool input[type=date]{height:28px;border:1px solid var(--line);border-radius:7px;padding:0 6px;font:inherit;font-size:12.5px}
#selTool .vs{width:1px;height:18px;background:var(--line2);margin:0 3px}

#areas{left:16px;top:calc(64px + env(safe-area-inset-top));width:236px;max-height:calc(100dvh - 160px);overflow:auto;padding:6px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:10px 10px 4px;font-size:12px;font-weight:600;color:var(--ink2)}
.sec-h small{font-size:11px;font-weight:400;color:var(--fnt)}
.td-row{display:flex;align-items:flex-start;gap:9px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:13.5px;line-height:1.4;color:var(--ink)}
.td-row:hover{background:#f4f4f5}
.td-row .ck{width:16px;height:16px;flex:none;margin-top:1px;border:1.5px solid #c4c4cc;border-radius:5px;background:#fff;display:grid;place-items:center;padding:0}
.td-row .ck.on{background:var(--ink);border-color:var(--ink)}
.td-row .ck.on::after{content:"";width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.td-row .gk{width:16px;height:16px;flex:none;margin-top:1px;border-radius:50%;border:1.5px solid var(--ink);background:#fff}
.td-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-row.done .t{color:var(--fnt);text-decoration:line-through}
.td-row .m{flex:none;font-family:var(--mono);font-size:11px;color:var(--fnt);margin-top:2px}
.td-row .m.late{color:var(--red)}
.td-empty{padding:4px 10px 8px;font-size:12px;color:var(--fnt)}
.td-add{position:relative;padding:8px 2px 4px}
.qa{border:1px solid var(--line);border-radius:12px;background:#fff;transition:border-color .15s,box-shadow .15s}
.td-add:focus-within .qa{border-color:var(--ring);outline:2px solid var(--ring);outline-offset:2px;box-shadow:0 1px 2px rgba(39,39,42,.05),0 6px 16px rgba(39,39,42,.07)}
.qa input[name=t]{display:block;width:100%;height:38px;border:0;background:transparent;padding:0 12px;font:inherit;font-size:13.5px;color:var(--ink);outline:0;min-width:0}
.qa input[name=t]::placeholder{color:var(--fnt)}
.qa-meta{display:none;align-items:center;gap:4px;flex-wrap:wrap;padding:0 6px 6px 8px}
.td-add:focus-within .qa-meta,.td-add.on .qa-meta{display:flex}
.qa-chip{height:24px;padding:0 8px;border:0;border-radius:999px;background:#f4f4f5;color:var(--ink2);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.qa-chip:hover{background:#e9e9ec;color:var(--ink)}
.qa-chip svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qa-chip.ico{width:24px;padding:0;justify-content:center;background:transparent;color:var(--mut)}
.qa-chip.ico:hover{background:#f4f4f5}
.qa-chip.set{background:var(--ink);color:#fff;padding-right:3px}
.qa-chip.set:hover{background:#27272a}
.qa-chip.set .x{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;color:#a1a1aa;font-size:13px;line-height:1}
.qa-chip.set .x:hover{background:rgba(255,255,255,.14);color:#fff}
.qa-go{margin-left:auto;width:26px;height:26px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:var(--ink);color:#fff}
.qa-go svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.qa-go:disabled{background:#f4f4f5;color:var(--fnt);cursor:default}
.qa-pick{position:absolute;left:12px;bottom:4px;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.qa-hint{display:none;padding:6px 10px 0;font-size:11px;color:var(--fnt)}
.td-add:focus-within:not(.on) .qa-hint{display:block}
.side-sep{height:1px;background:var(--line2);margin:6px 8px}
#goals{left:268px;right:16px;top:calc(64px + env(safe-area-inset-top));display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;align-items:stretch}
#goals::-webkit-scrollbar{display:none}
.gcard{display:flex;flex-direction:column;gap:4px;min-width:170px;max-width:250px;padding:8px 12px 9px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--lift);text-align:left;flex:none}
.gcard:hover{border-color:#c4c4cc}
.gcard .gt{font-family:var(--pen);font-size:23px;line-height:1.05;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .gm{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.gcard .gm i{width:7px;height:7px;border-radius:50%;flex:none}
.gcard .gm .d{margin-left:auto;font-family:var(--mono);color:var(--ink)}
.gcard.late{border-color:#f1b4a6}.gcard.late .d{color:var(--red)}
.gcard.done .gt{color:var(--fnt);text-decoration:line-through}
.gadd{flex:none;display:flex;align-items:center;padding:0 14px;border:1.5px dashed #d4d4d8;border-radius:12px;background:rgba(255,255,255,.7);font-size:12.5px;color:var(--mut)}
#pop{position:fixed;inset:0;z-index:40;background:rgba(24,24,27,.22);display:flex;justify-content:flex-end}
#pop .sheet{width:min(520px,100%);height:100%;background:#fff;box-shadow:var(--lift-hi);display:flex;flex-direction:column;animation:slin .22s ease-out}
@keyframes slin{from{transform:translateX(24px);opacity:.4}}
.ph{display:flex;align-items:center;gap:8px;padding:16px 20px 0;font-size:12px;color:var(--mut)}
.ph .x{margin-left:auto;width:32px;height:32px;border:0;border-radius:8px;background:transparent;font-size:18px;color:var(--mut)}
.ph .x:hover{background:#f4f4f5}
.pb{flex:1;overflow:auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:18px}
.pt{width:100%;border:0;outline:none;resize:none;font-family:var(--pen);font-size:36px;line-height:1.08;color:var(--ink);padding:6px 0;background:transparent}
.pt:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
.pm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pm label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.pm input,.pm select{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.pm .tg{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;font-weight:600}
.pm .tg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ps h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--mut)}
.ctx{display:flex;flex-direction:column;gap:2px}
.ctx button{display:flex;gap:8px;align-items:center;border:0;background:transparent;padding:5px 6px;border-radius:7px;text-align:left;font-size:13px;color:var(--ink2)}
.ctx button:hover{background:#f4f4f5}
.ctx .k{font-size:11px;color:var(--fnt);flex:none;width:34px}
.lg{display:flex;flex-direction:column;gap:10px;margin-left:4px;padding-left:14px}
.lg .e{position:relative;font-size:13px;line-height:1.55;color:var(--ink);white-space:pre-wrap}
.lg .e::before{content:"";position:absolute;left:-17.5px;top:6px;width:8px;height:8px;border-radius:50%;background:#fff;border:1.5px solid #c4c4cc}
.lg .e.me::before{background:var(--ink);border-color:var(--ink)}
.lg .w{display:block;font-family:var(--mono);font-size:10.5px;color:var(--fnt)}
.ai{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fafafa}
.ai textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;resize:vertical;background:#fff}
.ai .r{display:flex;align-items:center;gap:8px}
.ai .r small{flex:1;font-size:11.5px;color:var(--fnt)}
.ai button{height:34px;padding:0 14px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;font-weight:600}
.ai button[disabled]{opacity:.4}
.pf{display:flex;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line2)}
.pf button{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.pf .del{margin-left:auto;color:var(--red);border-color:transparent}
#areas .ah{display:flex;align-items:baseline;justify-content:space-between;padding:8px 10px 6px}
#areas .ah span{font-size:12px;font-weight:600;color:var(--ink2)}
#areas .ah .k{font-size:11px;font-weight:400;color:var(--fnt)}
.ar-row{display:flex;align-items:center;gap:9px;width:100%;height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:13.5px;color:var(--ink)}
.ar-row:hover{background:#f4f4f5}
.ar-row.on{background:#f1f1f3;font-weight:600}
.ar-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-row .st{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--fnt)}
.ar-row .st.late{color:var(--red)}
#areas .ar-add{display:flex;gap:6px;padding:8px 4px 4px}
#areas .ar-add input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font:inherit;font-size:12.5px}
#areas .ar-add button{height:30px;padding:0 9px;border:0;border-radius:8px;background:#f1f1f3;font-size:12.5px;font-weight:600}
#views{left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:2px;padding:4px}
#views button{height:30px;padding:0 14px;border:0;border-radius:8px;background:transparent;font-size:13px;color:var(--mut)}
#views button[aria-pressed="true"]{background:#f1f1f3;color:var(--ink);font-weight:600}
#road{position:fixed;left:0;right:0;bottom:0;top:calc(64px + env(safe-area-inset-top));z-index:15;background:#fff;border-top:1px solid var(--line2);display:flex}
.rd-names{width:200px;flex:none;border-right:1px solid var(--line2);overflow:hidden}
.rd-scroll{flex:1;overflow:auto}
.rd-inner{position:relative}
.rd-head{position:sticky;top:0;z-index:2;display:flex;height:44px;background:#fff;border-bottom:1px solid var(--line2)}
.rd-wk{flex:none;padding:8px 0 0 8px;font-family:var(--mono);font-size:11px;color:var(--fnt);border-left:1px solid var(--line2)}
.rd-wk b{display:block;font-family:var(--ui);font-size:12px;color:var(--ink2);font-weight:600;height:15px}
.rd-nh{height:44px;border-bottom:1px solid var(--line2);display:flex;align-items:flex-end;padding:0 14px 8px;font-size:12px;color:var(--fnt)}
.rd-name{display:flex;align-items:flex-start;gap:9px;padding:14px 14px 0;border-bottom:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--ink)}
.rd-name i{margin-top:6px}
.rd-name small{display:block;font-size:11.5px;font-weight:400;color:var(--fnt);margin-top:2px}
.rd-row{position:relative;border-bottom:1px solid var(--line2)}
.rd-grid{position:absolute;top:0;bottom:0;border-left:1px solid #f4f4f5}
.rd-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--red);z-index:1}
.rd-today span{position:absolute;top:4px;left:4px;font-family:var(--mono);font-size:10px;color:var(--red);white-space:nowrap}
.rg{position:absolute;display:flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 0;border:0;background:transparent;white-space:nowrap;z-index:2;text-align:left}
.rg i{width:11px;height:11px;border-radius:50%;background:var(--ink);flex:none;margin-left:-5.5px}
.rg span{font-family:var(--pen);font-size:24px;line-height:1;color:var(--ink)}
.rg em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--fnt)}
.rg:hover span{text-decoration:underline;text-decoration-thickness:1px}
.rg.late i{background:var(--red)}.rg.late em{color:var(--red)}
.rg.done i{background:#d4d4d8}.rg.done span{color:var(--fnt);text-decoration:line-through}
.rd-empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:var(--fnt);font-size:13px;line-height:1.7;pointer-events:none}
.rd-empty b{display:block;font-family:var(--pen);font-size:34px;font-weight:400;color:var(--mut)}
#selTool select{height:28px;border:1px solid var(--line);border-radius:7px;padding:0 6px;font:inherit;font-size:12.5px;background:#fff;max-width:130px}

#empty{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:5}
#empty .h{font-family:var(--pen);font-size:44px;line-height:1.1;color:var(--mut)}
#empty .s{font-size:13px;color:var(--fnt);margin-top:10px;line-height:1.7}
#empty kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--mut)}
#empty .touch{display:none}
@media (pointer:coarse){#empty .desk{display:none}#empty .touch{display:inline}}

#toast{left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:9px 14px;font-size:13px;transition:opacity .2s,transform .2s;display:flex;gap:10px;align-items:center}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:1px solid #52525b;background:transparent;color:#fff;border-radius:7px;height:26px;padding:0 8px;font-size:12px}

@media (max-width:640px){
  #areas{left:8px;right:8px;width:auto;top:calc(60px + env(safe-area-inset-top));max-height:none;display:flex;flex-direction:row;overflow-x:auto;padding:4px;gap:2px}
  #areas .ah,#areas .ar-add{display:none}
  .ar-row{width:auto;flex:none;height:32px}
  .ar-row .st{display:none}
  #views{top:auto;bottom:calc(84px + env(safe-area-inset-bottom))}
  #syncLbl span{display:none}
  #road{top:calc(108px + env(safe-area-inset-top))}
  .rd-names{width:112px}
  .rd-name{font-size:13px;padding:12px 10px 0}
  #brand b{display:none}
  #topR .hide-m{display:none}
  #tools button{width:54px}
  #empty .h{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== v3 · modern (Linear / ChatGPT) layout ===== */
:root{--ui:"Inter","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;--pen:var(--ui);--sb:264px;--hdr:120px;--sbbg:#f7f7f8}
body.sb-off{--sb:0px}
body{font-family:var(--ui);font-feature-settings:"cv11","ss01";letter-spacing:-0.006em}
#stage{left:var(--sb);top:var(--hdr)}
#road{left:var(--sb);top:var(--hdr)}
#empty{left:calc(var(--sb) + (100vw - var(--sb))/2);top:55%}
#empty .h{font-size:20px;font-weight:600;color:var(--mut);letter-spacing:-0.015em}
#tools{left:calc(var(--sb) + (100vw - var(--sb))/2)}
#toast{left:calc(var(--sb) + (100vw - var(--sb))/2)}
/* sidebar */
#sb{position:fixed;left:0;top:0;bottom:0;width:264px;z-index:25;background:var(--sbbg);border-right:1px solid var(--line2);display:flex;flex-direction:column;transition:transform .2s ease}
body.sb-off #sb{transform:translateX(-100%)}
.sb-top{display:flex;align-items:center;gap:4px;padding:10px 10px 6px}
#boardBtn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:38px;padding:0 8px;border:0;border-radius:8px;background:transparent;text-align:left}
#boardBtn:hover{background:#ececee}
#boardBtn .mk{width:24px;height:24px;flex:none;border-radius:7px;background:var(--ink);display:grid;place-items:center}
#boardBtn .mk i{width:6px;height:6px;border-radius:50%;background:var(--red)}
#boardBtn .nm{display:flex;flex-direction:column;min-width:0;line-height:1.2}
#boardBtn #boardName{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#boardBtn #boardKind{font-size:11.5px;color:var(--mut)}
#boardBtn .cv{margin-left:auto;color:var(--fnt);font-size:11px}
.icon-btn{width:34px;height:34px;flex:none;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--mut)}
.icon-btn:hover{background:#ececee;color:var(--ink)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#boards{position:fixed;left:10px;top:52px;width:244px;z-index:30;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--lift-hi)}
#areas{position:static;flex:1;width:auto;max-height:none;overflow:auto;padding:4px 8px 12px;background:transparent;border:0;box-shadow:none;border-radius:0}
#areas .sec-h{padding:14px 8px 4px;font-size:11.5px;font-weight:500;color:var(--mut);letter-spacing:0}
#areas .ah{padding:14px 8px 4px}
#areas .ah span{font-size:11.5px;font-weight:500;color:var(--mut)}
.td-row,.ar-row{border-radius:7px;font-size:13.5px}
.td-row:hover,.ar-row:hover{background:#ececee}
.ar-row.on{background:#e8e8eb}
.side-sep{margin:8px 8px}
.td-add input{background:#fff}
.sb-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line2);font-size:12px;color:var(--mut)}
.sb-foot .me{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#syncLbl{padding:0}
/* header */
#hdr{position:fixed;left:var(--sb);right:0;top:0;height:var(--hdr);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line2);display:flex;flex-direction:column;transition:left .2s ease}
.hrow{display:flex;align-items:center;gap:8px;height:52px;padding:0 14px}
#sbOpen{display:none}
body.sb-off #sbOpen{display:grid}
#views{position:static;transform:none;padding:3px;background:#f1f1f3;border:0;box-shadow:none;border-radius:9px}
#views button{height:28px;padding:0 12px;border-radius:7px;font-size:13px}
#views button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hsp{flex:1}
#topR{position:static;padding:0;background:transparent;border:0;box-shadow:none}
#goals{position:static;padding:2px 14px 12px;left:auto;right:auto;top:auto}
.gcard{min-width:180px;max-width:260px;padding:9px 12px;border-radius:10px;box-shadow:none;gap:6px}
.gcard .gt{font-family:var(--ui);font-size:13.5px;font-weight:600;line-height:1.3;letter-spacing:-0.01em}
.gcard .gm{font-size:11.5px}
.gadd{border-radius:10px;font-size:13px}
/* canvas objects */
.sticky{padding:14px 16px 16px;border-radius:6px}
.sticky .tx{font-family:var(--ui);font-size:14.5px;line-height:1.5;color:#27272a}
.text .tx{font-family:var(--ui);font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-0.015em;min-height:26px}
.text.big .tx{font-size:36px;font-weight:700;letter-spacing:-0.025em}
.goal{border:1px solid var(--line);border-radius:12px;box-shadow:var(--lift);gap:8px}
.goal .g-due{font-family:var(--ui);font-size:12px;color:var(--mut)}
.goal .g-chk svg{width:18px;height:18px}
.goal .tx{font-family:var(--ui);font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-0.01em}
.goal.late:not(.done){border-color:#f1b4a6}
.frame .ft{font-family:var(--ui);font-size:14px;font-weight:600;top:-28px;color:var(--ink2)}
.rg span{font-family:var(--ui);font-size:13px;font-weight:500}
.rd-empty b{font-family:var(--ui);font-size:16px;font-weight:600}
.pt{font-family:var(--ui);font-size:24px;font-weight:650;line-height:1.3;letter-spacing:-0.02em}
#pop .sheet{border-left:1px solid var(--line2)}
/* ===== card cleanup (no overlapping tags, single selection ring) ===== */
.it.sel::after{content:none}
.it.sel{outline:2px solid var(--ink);outline-offset:4px}
.goal.sel{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sticky.sel{outline:none;box-shadow:0 0 0 2px var(--ink),var(--lift)}
.frame.sel{outline:none;border-style:solid;border-color:var(--ink)}
.rz{right:-7px;bottom:-7px;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--ink);background:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:#f4f4f5;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap;letter-spacing:0}
.chip i{width:7px;height:7px;border-radius:50%;flex:none}
.chip.mono{font-family:var(--mono);font-size:11px;color:var(--mut)}
.chip.due{font-variant-numeric:tabular-nums}
.chip.due.late{background:#fdf0ec;color:var(--red)}
.chip.due.empty{background:transparent;border:1px dashed #d4d4d8;color:var(--fnt)}
.goal{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;box-shadow:none;background:#fff}
.goal:hover{border-color:#d4d4d8}
.goal.late:not(.done){border-color:var(--line)}
.goal .g-row{display:flex;align-items:flex-start;gap:10px}
.goal .g-chk{width:20px;height:20px;flex:none;margin-top:1px;display:grid;place-items:center;border:0;padding:0;background:none;border-radius:50%}
.goal .g-chk svg{width:16px;height:16px;fill:none;stroke:#a1a1aa;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.goal .g-chk:hover svg{stroke:var(--ink)}
.goal.late .g-chk svg{stroke:var(--red)}
.goal.done .g-chk svg circle{fill:var(--ink);stroke:var(--ink)}
.goal.done .g-chk svg path{stroke:#fff;stroke-width:1.8}
.goal .tx{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.4}
.goal.done .tx{color:var(--fnt);text-decoration:line-through}
.goal .g-meta{display:flex;flex-wrap:wrap;gap:6px;padding-left:30px}
.sticky{gap:10px}
.sticky .s-meta{display:flex;flex-wrap:wrap;gap:6px}
.sticky .s-meta .chip{background:rgba(255,255,255,.6)}

/* ===== 새 화면 안에 들어갈 때 (embed) ===== */
html.embed #sb,html.embed #hdr,html.embed #boards,html.embed #home{display:none!important}
html.embed{--sb:0px!important;--hdr:0px!important}
html.embed #stage,html.embed #road{left:0!important;top:0!important}
html.embed #pop{top:12px}

/* ===== 홈 (벤토) ===== */
#topR [hidden]{display:none!important}
#home{position:fixed;left:var(--sb);right:0;bottom:0;top:var(--hdr);z-index:15;overflow:auto;background:#fafafa;border-top:1px solid var(--line2);transition:left .2s ease}
#home .hwrap{max-width:1240px;margin:0 auto;padding:22px 28px 60px}
#home .htop{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px}
#home .hd{font-size:20px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
#home .hs{font-size:13px;color:var(--mut);margin-top:3px}
#home .sp{flex:1}
#home .bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:stretch}
#home .cell{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;min-width:0}
#home .c-main{grid-column:span 7;min-height:300px}
#home .c-dec{grid-column:span 5;min-height:300px}
#home .c-run{grid-column:span 7}
#home .c-auto{grid-column:span 5}
#home .c-sm{grid-column:span 4}
#home .ch{display:flex;align-items:center;gap:8px;height:28px;margin-bottom:6px}
#home .ch h3{margin:0;font-size:13.5px;font-weight:600;color:var(--ink)}
#home .cnt{font-size:12px;font-weight:600;color:var(--mut);background:#f4f4f5;border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
#home .lbl{font-size:11.5px;font-weight:600;color:var(--mut);margin:10px 0 2px;display:flex;gap:8px;align-items:center}
#home .lbl.red{color:var(--red);margin-top:0}
#home .soon{font-weight:500;color:var(--fnt)}
#home .hempty{font-size:13px;color:var(--fnt);padding:14px 2px}
#home .hb{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap}
#home .hb:hover{border-color:#d4d4d8;color:var(--ink)}
#home .hb.pri{background:var(--ink);border-color:var(--ink);color:#fff}
#home .hb.ghost{border-color:transparent;background:transparent;color:var(--mut)}
#home .hb.ghost:hover{background:#f4f4f5;color:var(--ink)}
/* 사건 한 줄 */
#home .sg{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-top:1px solid var(--line2)}
#home .cb>.sg:first-child,#home .lbl+.sg,#home .nowbox .lbl+.sg{border-top:0}
#home .src{flex:none;width:52px;font-size:11px;font-weight:600;color:var(--mut);padding-top:2px}
#home .sg-m{flex:1;min-width:0}
#home .sg-t{font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.4}
#home .sg-t a{color:inherit;text-decoration:none}
#home .sg-t a:hover{text-decoration:underline}
#home .sg-b{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#home .sg-r{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:11.5px;color:var(--fnt);margin-top:3px}
#home .sg-r .why{color:var(--mut)}
#home .sg-r .ar,#home .sg-r .pv,#home .sg-r .smp,#home .sg-r .ai{font-size:10.5px;font-weight:600;border-radius:5px;padding:0 6px;line-height:17px}
#home .sg-r .ar{background:#f4f4f5;color:var(--ink2)}
#home .sg-r .pv{background:#eef2ff;color:#4752c4}
#home .sg-r .smp{background:#fff7e0;color:#9a6b00}
#home .sg-r .ai{background:#f3ecff;color:#7044c7}
#home .sg-a{flex:none;display:flex;gap:4px;opacity:.0;transition:opacity .12s}
#home .sg:hover .sg-a,#home .sg.now .sg-a{opacity:1}
#home .sg-a{flex-direction:column;align-items:flex-end}
#home .nowbox{background:#fdf3f0;border:1px solid #f6d7cd;border-radius:10px;padding:8px 10px 2px;margin-bottom:8px}
#home .nowbox .sg{border-top-color:#f6d7cd}
#home .gate{border:1px dashed #d4d4d8;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:13.5px;color:var(--ink)}
#home .gate .g2{font-size:12.5px;color:var(--mut);margin-bottom:6px}
/* 메인 일 */
#home .mains{display:flex;flex-direction:column}
#home .mn,#home .cd{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line2)}
#home .mains .mn:first-child{border-top:0}
#home .mn .no{flex:none;width:18px;font-size:12px;font-weight:600;color:var(--fnt);font-variant-numeric:tabular-nums}
#home .mn-m{flex:1;min-width:0}
#home .mn-t{font-size:15px;font-weight:600;color:var(--ink);line-height:1.35}
#home .cd .mn-t{font-size:13.5px;font-weight:500}
#home .mn-r{font-size:12px;color:var(--mut);margin-top:2px}
#home .mn.done .mn-t{color:var(--fnt);text-decoration:line-through}
#home .hk-b{flex:none;width:22px;height:22px;display:grid;place-items:center;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
#home .hk{fill:none;stroke:#a1a1aa;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#home .hk-b:hover .hk{stroke:var(--ink)}
#home .hk.on circle{fill:var(--ink);stroke:var(--ink)}#home .hk.on path{stroke:#fff;stroke-width:1.8}
#home .cands{margin-top:6px;border-top:1px solid var(--line2);padding-top:2px}
#home .cands .cd:first-of-type{border-top:0}
#home .tgl{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px 0 6px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;font-size:12px;font-weight:500;color:var(--mut);cursor:pointer}
#home .tgl i{width:24px;height:14px;border-radius:7px;background:#e4e4e7;position:relative;transition:background .15s}
#home .tgl i::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:transform .15s}
#home .tgl.on{color:var(--ink)}#home .tgl.on i{background:var(--ink)}#home .tgl.on i::after{transform:translateX(10px)}
/* 작은 칸 */
#home .col{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px}
#home .col i{width:7px;height:7px;border-radius:50%;background:#22a06b;flex:none}
#home .col.bad i{background:var(--red)}
#home .col .cn{font-weight:600;color:var(--ink);width:58px;flex:none}
#home .col .cnote{flex:1;min-width:0;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#home .col.bad .cnote{color:var(--red)}
#home .col .ct{color:var(--fnt);font-size:11.5px;flex:none}
#home .up{display:flex;align-items:baseline;gap:10px;padding:6px 0;font-size:12.5px}
#home .up .ud{flex:none;width:64px;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
#home .up .ut{flex:1;min-width:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#home .up .us{flex:none;font-size:11px;color:var(--fnt)}
#home .big{font-size:40px;font-weight:650;letter-spacing:-.02em;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
#home .big span{font-size:15px;font-weight:500;color:var(--mut);margin-left:3px}
#home .big.over{color:var(--red)}
#home .sub{font-size:12.5px;color:var(--mut);margin-top:6px;display:flex;align-items:center;gap:6px}
#home .rules{margin-top:6px}
#home .rl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:3px 0}
#home .rl span{flex:1}
@media (max-width:1023px){#home .c-main,#home .c-dec,#home .c-run,#home .c-auto{grid-column:span 12}#home .c-sm{grid-column:span 6}}
@media (max-width:767px){#home .hwrap{padding:16px 14px 80px}#home .c-sm{grid-column:span 12}#home .sg-a{opacity:1}}

/* ===== 제자리 이름 고치기 ===== */
.inl-edit{flex:1;min-width:0;height:24px;margin:-2px 0;padding:0 6px;border:2px solid var(--ring);border-radius:6px;background:#fff;font:inherit;font-size:inherit;font-weight:inherit;color:var(--ink);outline:none}
.gcard.renaming .inl-edit{width:100%;flex:none}
.it .tx[contenteditable="true"]{cursor:text;outline:none;caret-color:var(--ink)}

/* ===== 연결선 ===== */
.links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.links .hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.links .ln{fill:none;stroke:#b4b4bc;stroke-width:1.5;pointer-events:none}
.links .hot .ln{stroke:#52525b}
.links .on .ln{stroke:var(--ink);stroke-width:2}
.links .temp{stroke:var(--ink);stroke-dasharray:5 4}
.links .dim{opacity:.2}
.links foreignObject{pointer-events:none;overflow:visible}
.links .lbl{display:flex;justify-content:center;align-items:center;height:24px}
.links .lbl span{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:500;color:var(--ink2);white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.lk{position:absolute;right:-22px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);cursor:crosshair;z-index:2}
.lk::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.lk:hover{transform:scale(1.15)}
.it.lk-target{box-shadow:0 0 0 2px var(--ink)!important}
.lk-src{position:absolute;inset:-4px;border:2px dashed var(--ink);border-radius:12px;pointer-events:none}

@media (max-width:767px){
  :root{--hdr:116px}
  body{--sb:0px}
  #sb{transform:translateX(-100%);box-shadow:var(--lift-hi);width:min(300px,86vw)}
  body.sb-m #sb{transform:none}
  #sbOpen{display:grid!important}
  #sbClose{display:grid}
  #areas{display:block}

<script>
(()=>{
const KEY='direction-whiteboard-v0';
const COLORS=['yellow','pink','blue','green','white'];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stage=$('#stage'),world=$('#world');
const SW=()=>stage.clientWidth||innerWidth,SH=()=>stage.clientHeight||innerHeight;

/* ---------- state ---------- */
function fresh(){const b={id:uid(),name:'나',kind:'personal'};return {v:1,boards:[b],cur:b.id,items:{[b.id]:[]},views:{}}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.boards||!S.boards.length)S=fresh();
const items=()=>S.items[S.cur]||(S.items[S.cur]=[]);
const view=()=>S.views[S.cur]||(S.views[S.cur]={x:SW()/2,y:SH()/2,z:1});
let saveT;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250);if(remote)queueSync()};

let tool='select',sel=new Set(),editing=null;
const DEF_AREAS={personal:['가족','업무','운동','모임'],company:['기타']};
const AC=['#5b7bd5','#2f9e8f','#c98a1b','#8e6bd8','#4c9a52','#d0629b','#8b8b94'];
const curB=()=>S.boards.find(b=>b.id===S.cur);
function areasOf(b=curB()){if(!b.areas||!b.areas.length)b.areas=DEF_AREAS[b.kind].map((n,i)=>({id:uid().slice(0,8),name:n,color:AC[i%AC.length]}));return b.areas}
let focusArea=null,viewMode='board';

/* ---------- server sync (lidge backend) ---------- */
let remote=false,syncSeq=0,synced={},syncTimer=null,syncing=false,pendingRender=false,pollTimer=null;
const api=(p,o={})=>fetch(p,{credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json'},...o}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
const strip=it=>{const {id,by,boardId,updatedAt,deleted,...rest}=it;return rest};
const ikey=it=>JSON.stringify(strip(it));
const fromServer=it=>{const {boardId,updatedAt,deleted,...rest}=it;return rest};
function setSync(s){const el=document.getElementById('syncLbl');el.className=s;el.querySelector('span').textContent={ok:'동기화됨',local:'이 기기에만',err:'저장 실패 · 다시 시도 중',busy:'저장 중'}[s]||s}
function queueSync(){clearTimeout(syncTimer);syncTimer=setTimeout(flush,400)}
async function flush(){
  if(syncing){queueSync();return}
  syncing=true;let failed=false;
  try{
    for(const b of S.boards){
      const list=S.items[b.id]||[];const seen=new Set();
      for(const it of list){const k=b.id+'/'+it.id;seen.add(k);const v=ikey(it);if(synced[k]===v)continue;
        try{const r=await api(`/api/boards/${b.id}/items/${it.id}`,{method:'PUT',body:JSON.stringify(strip(it))});synced[k]=ikey(fromServer(r));it.by=r.by}catch(e){failed=true}}
      for(const k of Object.keys(synced)){if(!k.startsWith(b.id+'/')||seen.has(k))continue;const iid=k.slice(b.id.length+1);
        try{await api(`/api/boards/${b.id}/items/${iid}`,{method:'DELETE'});delete synced[k]}catch(e){failed=true}}
    }
  }finally{syncing=false}
  setSync(failed?'err':'ok');if(failed)setTimeout(queueSync,4000);
}
async function poll(){
  if(syncing||!remote)return;
  let res;try{res=await api('/api/changes?since='+syncSeq)}catch(e){setSync('err');return}
  syncSeq=res.seq;let touched=false;
  for(const b of res.boards){const i=S.boards.findIndex(x=>x.id===b.id);
    if(b.deleted){if(i>=0){S.boards.splice(i,1);touched=true;if(S.cur===b.id)S.cur=S.boards[0].id}}
    else if(i<0){S.boards.push({id:b.id,name:b.name,kind:b.kind,areas:b.areas||[]});S.items[b.id]=S.items[b.id]||[];touched=true}
    else{if(S.boards[i].name!==b.name){S.boards[i].name=b.name;touched=true}
      if(JSON.stringify(S.boards[i].areas||[])!==JSON.stringify(b.areas||[])){S.boards[i].areas=b.areas||[];touched=true}}}
  for(const it of res.items){const bid=it.boardId,k=bid+'/'+it.id;const list=S.items[bid]||(S.items[bid]=[]);const idx=list.findIndex(x=>x.id===it.id);
    const local=idx>=0?list[idx]:null;const dirty=local&&synced[k]!==undefined&&ikey(local)!==synced[k];
    if(editing===it.id||(typeof mode!=='undefined'&&mode&&sel.has(it.id))||dirty)continue;
    if(it.deleted){if(idx>=0){list.splice(idx,1);touched=touched||bid===S.cur;sel.delete(it.id)}delete synced[k];continue}
    const srv=fromServer(it);synced[k]=ikey(srv);
    if(local&&ikey(local)===ikey(srv)){local.by=srv.by;continue}
    if(idx>=0)list[idx]=srv;else list.push(srv);if(bid===S.cur)touched=true}
  if(touched){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
}
async function boot(){
  try{
    const st=await api('/api/state');remote=true;syncSeq=st.seq;
    const localItems=S.items,localPersonal=S.boards.find(b=>b.kind==='personal');
    S.boards=st.boards.filter(b=>!b.deleted).map(b=>({id:b.id,name:b.name,kind:b.kind,areas:b.areas||[]}));if(st.me&&st.me.email)document.getElementById('meLbl').textContent=st.me.email;
    const grouped={};for(const b of S.boards)grouped[b.id]=[];synced={};
    for(const it of st.items){const srv=fromServer(it);(grouped[it.boardId]||(grouped[it.boardId]=[])).push(srv);synced[it.boardId+'/'+it.id]=ikey(srv)}
    S.items=grouped;
    const myP=S.boards.find(b=>b.kind==='personal');
    if(myP&&!grouped[myP.id].length&&localPersonal&&(localItems[localPersonal.id]||[]).length&&!localStorage.getItem(KEY+':migrated')){
      grouped[myP.id]=localItems[localPersonal.id].map(x=>({...x}));localStorage.setItem(KEY+':migrated','1');queueSync();toast('이 기기에 있던 내용을 서버로 옮겼어요')}
    if(!S.boards.find(b=>b.id===S.cur))S.cur=myP?myP.id:S.boards[0].id;
    setSync('ok');render();pollTimer=setInterval(poll,3000);
    requestAnimationFrame(()=>{if(!items().length)return;const vis=[...world.querySelectorAll('.it')].some(n=>{const r=n.getBoundingClientRect();return r.right>240&&r.bottom>60&&r.left<innerWidth&&r.top<innerHeight-90});if(!vis)fit()});
  }catch(e){remote=false;setSync('local')}
}
const hist=[],redo=[];
function snap(){hist.push(JSON.stringify(items()));if(hist.length>120)hist.shift();redo.length=0}
function undo(){if(!hist.length)return;redo.push(JSON.stringify(items()));S.items[S.cur]=JSON.parse(hist.pop());sel.clear();render();save()}
function redoF(){if(!redo.length)return;hist.push(JSON.stringify(items()));S.items[S.cur]=JSON.parse(redo.pop());sel.clear();render();save()}

/* ---------- geometry ---------- */
function toWorld(cx,cy){const v=view(),r=stage.getBoundingClientRect();return {x:(cx-r.left-v.x)/v.z,y:(cy-r.top-v.y)/v.z}}
function applyView(){const v=view();world.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;stage.style.backgroundSize=`${24*v.z}px ${24*v.z}px`;stage.style.backgroundPosition=`${v.x}px ${v.y}px`;$('#zoomLbl').textContent=Math.round(v.z*100)+'%';placeSelTool()}
function zoomAt(cx,cy,nz){const v=view(),r=stage.getBoundingClientRect();nz=Math.min(4,Math.max(.15,nz));const wx=(cx-r.left-v.x)/v.z,wy=(cy-r.top-v.y)/v.z;v.z=nz;v.x=cx-r.left-wx*nz;v.y=cy-r.top-wy*nz;applyView();save()}

/* ---------- dates ---------- */
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function dday(due){if(!due)return {t:'',late:false};const d=new Date(due+'T00:00:00');const n=Math.round((d-today0())/864e5);if(n===0)return{t:'D-day',late:false};return n>0?{t:'D-'+n,late:false}:{t:'+'+(-n)+'일',late:true}}
function dueLabel(due){if(!due)return '언제까지?';const d=new Date(due+'T00:00:00');return `~${d.getMonth()+1}/${d.getDate()}까지`}

/* ---------- render ---------- */
const chk=done=>`<svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 5 C 9 4, 15 4.5, 20 4 C 20.5 9, 20 15, 20.5 20 C 15 20.5, 9 19.5, 4 20 C 3.5 15, 4.5 9, 4 5 Z" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linejoin="round"/>${done?'<path d="M7 12 L11 16 L19 6" fill="none" stroke="#18181b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>':''}</svg>`;
function itemHTML(it){
  if(it.type==='todo'||it.type==='link')return '';
  const a=it.area&&areasOf().find(x=>x.id===it.area);
  const s=(sel.has(it.id)?' sel':'')+(focusArea&&it.area!==focusArea?' dim':'');
  const arChip=a?`<span class="chip"><i style="background:${a.color}"></i>${esc(a.name)}</span>`:'';
  const agChip=it.by==='agent'?'<span class="chip mono">agent</span>':'';
  const autoH=it.type==='text'||it.type==='goal';
  const st=`left:${it.x}px;top:${it.y}px;width:${it.w}px;${autoH?'':'height:'+it.h+'px;'}`;
  const rz=(sel.size===1&&sel.has(it.id)&&it.type!=='text'?'<div class="rz" data-rz></div>':'')+(sel.size===1&&sel.has(it.id)&&it.type!=='frame'?'<div class="lk" data-lk title="끌어서 다른 카드에 연결"></div>':'')+(linkFrom===it.id?'<div class="lk-src"></div>':'');
  if(it.type==='sticky')return `<div class="it sticky c-${it.color||'yellow'}${s}" data-id="${it.id}" style="${st}"><div class="tx" data-ph="메모">${esc(it.text)}</div>${arChip||agChip?`<div class="s-meta">${arChip}${agChip}</div>`:''}${rz}</div>`;
  if(it.type==='text')return `<div class="it text${it.big?' big':''}${s}" data-id="${it.id}" style="${st}"><div class="tx" data-ph="글">${esc(it.text)}</div>${rz}</div>`;
  if(it.type==='goal'){const d=dday(it.due);const late=d.late&&!it.done;const due=it.due?(()=>{const x=new Date(it.due+'T00:00:00');const day=(window.W&&W.long)?W.long(it.due):`${x.getMonth()+1}월 ${x.getDate()}일`;return `${day} · ${it.done?'완료':d.t}`})():'언제까지?';
    return `<div class="it goal${it.done?' done':''}${late?' late':''}${s}" data-id="${it.id}" style="${st}"><div class="g-row"><button class="g-chk" type="button" data-chk aria-label="${it.done?'완료 취소':'완료'}"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="6.75"/>${it.done?'<path d="M5.2 8.3l1.9 1.9 3.7-4"/>':''}</svg></button><div class="tx" data-ph="무엇을 달성할지">${esc(it.text)}</div></div><div class="g-meta"><span class="chip due${late?' late':''}${it.due?'':' empty'}">${due}</span>${arChip}${agChip}</div>${rz}</div>`}
  if(it.type==='frame')return `<div class="it frame${s}" data-id="${it.id}" style="${st}"><div class="ft tx" data-ph="영역 이름">${esc(it.text)}</div>${rz}</div>`;
  return '';
}
function render(){
  if(editing){pendingRender=true;return}
  pendingRender=false;
  const list=[...items()].sort((a,b)=>(a.type==='frame'?0:1)-(b.type==='frame'?0:1)||(a.z||0)-(b.z||0));
  const frames=list.filter(i=>i.type==='frame'),rest=list.filter(i=>i.type!=='frame');
  world.innerHTML=frames.map(itemHTML).join('')+'<svg id="links" class="links" aria-hidden="true"></svg>'+rest.map(itemHTML).join('');
  drawLinks();
  $('#empty').hidden=items().some(i=>i.type!=='todo'&&i.type!=='link')||viewMode!=='board';

  const as=areasOf(),t0=today0(),W=132,dayW=W/7,weeks=18;

let linkFrom=null;
function rectOf(id){const it=byId(id);const n=el(id);if(!it||!n)return null;return {x:it.x,y:it.y,w:n.offsetWidth,h:n.offsetHeight}}

function curve(p,q){const k=Math.max(36,Math.min(150,Math.hypot(q.x-p.x,q.y-p.y)/2.4));return `M${p.x} ${p.y} C${p.x+p.dir[0]*k} ${p.y+p.dir[1]*k}, ${q.x+q.dir[0]*k} ${q.y+q.dir[1]*k}, ${q.x} ${q.y}`}

const DEF={sticky:{w:200,h:180},text:{w:320,h:40},goal:{w:300,h:132},frame:{w:520,h:380},todo:{w:240,h:90}};

function startEdit(id){

  tx.contentEditable='true';tx.focus();
  const rg=document.createRange();rg.selectNodeContents(tx);rg.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(rg);

    if(!ie0){linkFrom=null;setTool('select');render();return}

  const lk=e.target.closest('[data-lk]');
  if(lk){mode='link';start.from=lk.closest('.it').dataset.id;$('#selTool').hidden=true;return}
  const lg=e.target.closest('[data-link]');
  if(lg&&!spaceDown){sel=new Set([lg.dataset.link]);render();mode=null;start=null;return}
  if(e.target.closest('[data-chk]')){const id=e.target.closest('.it').dataset.id;const it=byId(id);snap();it.done=!it.done;render();save();mode=null;return}

  const ie=e.target.closest('.it');
  if(ie&&!spaceDown&&e.button!==1){
    const id=ie.dataset.id;
    if(e.shiftKey){sel.has(id)?sel.delete(id):sel.add(id)}else if(!sel.has(id)){sel=new Set([id])}
    const ids=new Set(sel);
    for(const sid of sel){const f=byId(sid);if(f&&f.type==='frame'){for(const o of items()){if(o.type!=='frame'&&o.x>=f.x&&o.y>=f.y&&o.x+o.w<=f.x+f.w&&o.y+(o.h||40)<=f.y+f.h)ids.add(o.id)}}}

  const z=view().z;

  else if(mode==='move'&&moved){if(!start.snapped){snap();start.snapped=true;$('#selTool').hidden=true}
    for(const s of start.items){const it=byId(s.id);it.x=Math.round(s.x+dx/z);it.y=Math.round(s.y+dy/z);const n=el(s.id);if(n){n.style.left=it.x+'px';n.style.top=it.y+'px'}}drawLinks()}

function endPtr(e){
  ptrs.delete(e.pointerId);stage.classList.remove('panning');
  if(mode==='pinch'){if(ptrs.size<2){mode=null;pinch=null}return}

  if(mode==='pan'&&!moved){sel.clear();if(linkFrom){linkFrom=null}render()}

addEventListener('keydown',e=>{

  if(e.key.toLowerCase()==='o'&&sel.size===1){openPop([...sel][0]);return}

$('#boards').addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(!b)return;S.cur=b.dataset.b;sel.clear();focusArea=null;hist.length=0;redo.length=0;$('#boards').hidden=true;render();save();if(items().length&&!S.views[S.cur+':seen']){S.views[S.cur+':seen']=1;fit()}});
$('#boards').addEventListener('submit',e=>{e.preventDefault();const v=e.target.querySelector('input').value.trim();if(!v)return;
  if(remote){api('/api/boards',{method:'POST',body:JSON.stringify({name:v,kind:'company'})}).then(nb=>{S.boards.push({id:nb.id,name:nb.name,kind:nb.kind,areas:nb.areas||[]});S.items[nb.id]=[];S.cur=nb.id;sel.clear();hist.length=0;$('#boards').hidden=true;render();save();toast(`"${v}" 회사 보드를 만들었어요 · 완우도 볼 수 있어요`)}).catch(()=>toast('보드를 만들지 못했어요. 잠시 후 다시 해주세요'));return}
  const b={id:uid(),name:v,kind:'company'};S.boards.push(b);S.items[b.id]=[];S.cur=b.id;sel.clear();hist.length=0;$('#boards').hidden=true;render();save();toast(`"${v}" 회사 보드를 만들었어요`)});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#boards,#boardBtn'))$('#boards').hidden=true},true);

/* ---------- top right ---------- */
$('#zoomLbl').addEventListener('click',()=>zoomAt(stage.getBoundingClientRect().left+SW()/2,stage.getBoundingClientRect().top+SH()/2,1));
$('#fitBtn').addEventListener('click',fit);
function fit(list){const its=(Array.isArray(list)&&list.length?list:items()).filter(i=>i.type!=='todo'&&i.type!=='link');if(!its.length){const v=view();v.x=SW()/2;v.y=SH()/2;v.z=1;applyView();return}
  const minX=Math.min(...its.map(i=>i.x)),minY=Math.min(...its.map(i=>i.y-(i.type==='frame'?40:0))),maxX=Math.max(...its.map(i=>i.x+i.w)),maxY=Math.max(...its.map(i=>i.y+(i.h||40)));
  const pad=120,z=Math.min(1.5,Math.min((SW()-pad*2)/(maxX-minX),(SH()-pad*2-60)/(maxY-minY)));const v=view();v.z=Math.max(innerWidth<640?.55:.15,z);v.x=SW()/2-(minX+maxX)/2*v.z;v.y=SH()/2-(minY+maxY)/2*v.z+10;applyView();save()}
$('#exportBtn').addEventListener('click',()=>{
  const b=S.boards.find(x=>x.id===S.cur);
  const out={format:'direction-board/v0',exportedAt:new Date().toISOString(),board:{name:b.name,kind:b.kind},items:items().map(({id,type,x,y,w,h,text,color,due,done,from,to})=>({id,type,text,due:due??undefined,done:type==='goal'?!!done:undefined,color,x,y,w,h,from,to}))};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download=`board-${b.name}-${new Date().toISOString().slice(0,10)}.json`;a.click();toast('JSON으로 내보냈어요. 에이전트가 바로 읽을 수 있어요');
});

/* ---------- toast ---------- */
let toastT,toastFn;function toast(t,fn){$('#toastT').textContent=t;toastFn=fn||null;$('#toastU').hidden=!fn;$('#toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('on'),fn?4500:2600)}
$('#toastU').addEventListener('click',()=>{if(toastFn)toastFn();$('#toast').classList.remove('on')});

/* ---------- agent-friendly API ---------- */
window.whiteboard={
  boards:()=>S.boards.map(b=>({...b,items:(S.items[b.id]||[]).length})),
  current:()=>S.cur,
  items:(boardId=S.cur)=>JSON.parse(JSON.stringify(S.items[boardId]||[])),
  add:(item,boardId=S.cur)=>{const d=DEF[item.type]||DEF.sticky;const it={id:uid(),w:d.w,h:d.h,x:0,y:0,text:'',z:Date.now(),...item};(S.items[boardId]||(S.items[boardId]=[])).push(it);if(boardId===S.cur)render();save();return it.id},
  update:(id,patch,boardId=S.cur)=>{const it=(S.items[boardId]||[]).find(i=>i.id===id);if(!it)return false;Object.assign(it,patch);if(boardId===S.cur)render();save();return true},
  remove:(id,boardId=S.cur)=>{S.items[boardId]=(S.items[boardId]||[]).filter(i=>i.id!==id);if(boardId===S.cur)render();save()},
};

/* ---------- sidebar (접기) ---------- */
const isMobile=()=>matchMedia('(max-width:767px)').matches;
function setSidebar(open){if(isMobile()){document.body.classList.toggle('sb-m',open)}else{const was=!document.body.classList.contains('sb-off');if(was!==open){const v=view();v.x+=open?-264:264;applyView()}document.body.classList.toggle('sb-off',!open);try{localStorage.setItem(KEY+':sb',open?'1':'0')}catch(e){}save()}setTimeout(()=>{applyView();placeSelTool()},220)}
const sbOpenNow=()=>isMobile()?document.body.classList.contains('sb-m'):!document.body.classList.contains('sb-off');
if(localStorage.getItem(KEY+':sb')==='0')document.body.classList.add('sb-off');
$('#sbClose').addEventListener('click',()=>setSidebar(false));
$('#sbOpen').addEventListener('click',()=>setSidebar(!sbOpenNow()));
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='\\'){e.preventDefault();setSidebar(!sbOpenNow())}});
document.addEventListener('pointerdown',e=>{if(isMobile()&&document.body.classList.contains('sb-m')&&!e.target.closest('#sb,#sbOpen,#boards'))setSidebar(false)},true);
$('#sb').addEventListener('pointerdown',e=>e.stopPropagation());
$('#hdr').addEventListener('pointerdown',e=>e.stopPropagation());
$('#meLbl').textContent='jun@lidgeai.com';

addEventListener('resize',placeSelTool);
window.__db={S:()=>S,save,render,api,esc,toast,dday,whenLabel,setView,remote:()=>remote};
if(document.documentElement.classList.contains('embed')){
  const q=new URLSearchParams(location.search);const qb=q.get('board');if(qb&&S.boards.some(b=>b.id===qb))S.cur=qb;
  addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='db:view')return;
    if(e.data.boardId&&e.data.boardId!==S.cur&&S.boards.some(b=>b.id===e.data.boardId)){S.cur=e.data.boardId;sel.clear();focusArea=null;hist.length=0;redo.length=0;render();save()}
    if(e.data.view&&e.data.view!==viewMode)setView(e.data.view)});
}
render();
boot();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&remote)poll()});
// first paint: if this board has items but none are on screen (e.g. opened on a phone), fit them in view
requestAnimationFrame(()=>{const its=items();if(!its.length)return;const vis=[...world.querySelectorAll('.it')].some(n=>{const r=n.getBoundingClientRect();return r.right>0&&r.bottom>0&&r.left<innerWidth&&r.top<innerHeight});if(!vis)fit()});
})();
</script>
<script src="home.js?v=4"></script>
</body>

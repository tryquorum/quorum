name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build static site
        working-directory: site/web
        env:
          QUORUM_BASE: /quorum/
          QUORUM_OUT: ${{ github.workspace }}/_pages
          VITE_QUORUM_STATIC: "1"
        run: |
          bun install --frozen-lockfile
          bun run build
          touch "$QUORUM_OUT/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
